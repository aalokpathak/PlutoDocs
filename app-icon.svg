<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plutoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadowPluto" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Cosmic Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#090d16" filter="url(#shadowPluto)" />

  <!-- Subtle Orbit Glow Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.3" transform="rotate(-30 256 256)" />

  <!-- Document Sheet -->
  <path d="M 136 112 L 312 112 L 376 176 L 376 400 C 376 417.7 361.7 432 344 432 L 136 432 C 118.3 432 104 417.7 104 400 L 104 144 C 104 126.3 118.3 112 136 112 Z" fill="url(#paperGrad)" />

  <!-- Folded Corner -->
  <path d="M 312 112 L 312 176 L 376 176 Z" fill="#cbd5e1" />

  <!-- Document Text Layout Lines -->
  <rect x="136" y="192" width="160" height="14" rx="4" fill="url(#plutoGrad)" opacity="0.85" />
  <rect x="136" y="232" width="208" height="10" rx="3" fill="#94a3b8" opacity="0.7" />
  <rect x="136" y="264" width="180" height="10" rx="3" fill="#94a3b8" opacity="0.7" />
  <rect x="136" y="296" width="200" height="10" rx="3" fill="#94a3b8" opacity="0.7" />

  <!-- Cosmic Accent Badge / Pluto Planet Motif -->
  <circle cx="340" cy="356" r="52" fill="url(#plutoGrad)" filter="url(#shadowPluto)" />
  <path d="M 320 356 L 334 370 L 364 340" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
