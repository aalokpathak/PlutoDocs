[package]
name = "plutodocs"
version = "0.1.0"
description = "PlutoDocs - a modern rich-text document processor from the Pluto suite"
authors = ["Pluto Software"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "plutodocs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

# Native PDF export goes through WebView2's PrintToPdf; versions must match the ones wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
